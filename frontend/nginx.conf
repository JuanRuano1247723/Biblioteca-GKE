server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Kubernetes. Permite que nginx arranque aunque un Service todavia no exista.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    # nginx NO aplica los dominios de busqueda de Kubernetes cuando el destino
    # va en una variable, asi que se usa el nombre completo (FQDN) del Service.
    set $ejemplares_upstream http://ejemplares-svc.holdovers.svc.cluster.local:8000;
    set $prestamos_upstream  http://prestamos-svc.holdovers.svc.cluster.local:8000;

    # Sin URI despues de proxy_pass: la ruta original (/api/...) se reenvia tal cual.
    location /api/ejemplares {
        proxy_pass $ejemplares_upstream;
    }

    location /api/integrantes {
        proxy_pass $ejemplares_upstream;
    }

    location /api/prestamos {
        proxy_pass $prestamos_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
