apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestamos
  namespace: holdovers
spec:
  replicas: 1                  # luego lo cambias a 3 en el YAML (F1)
  selector:
    matchLabels: { app: prestamos }
  template:
    metadata:
      labels: { app: prestamos }
    spec:
      containers:
        - name: prestamos
          image: us-central1-docker.pkg.dev/virtualizacion-1149123-1186023/holdovers/prestamos:v1
          ports:
            - containerPort: <puerto>
          envFrom:
            - configMapRef: { name: biblioteca-config }
            - secretRef:    { name: biblioteca-secret }
          readinessProbe:
            httpGet: { path: <ruta de salud>, port: <puerto> }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: prestamos-svc
  namespace: holdovers
spec:
  selector: { app: prestamos }
  ports:
    - port: <puerto>
      targetPort: <puerto>