apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestamos
  namespace: holdovers
  labels:
    app: prestamos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prestamos
  template:
    metadata:
      labels:
        app: prestamos
    spec:
      containers:
        - name: prestamos
          image: us-central1-docker.pkg.dev/virtualizacion-1149123-1186023/holdovers/prestamos:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-credenciales
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prestamos-svc
  namespace: holdovers
spec:
  selector:
    app: prestamos
  ports:
    - port: 8000
      targetPort: 8000